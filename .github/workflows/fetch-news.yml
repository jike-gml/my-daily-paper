name: Fetch official news

on:
  workflow_dispatch:
  schedule:
    - cron: '10 21 * * *'
    - cron: '10 3 * * *'

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch official feeds
        run: python scripts/fetch_news.py

      - name: Commit updated news.json
        run: |
          if git diff --quiet -- news.json; then
            echo "No news.json changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update official news feed"
          git push
